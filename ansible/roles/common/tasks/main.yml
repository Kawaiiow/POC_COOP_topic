---
- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline administrative and network packages
  ansible.builtin.apt:
    name: "{{ common_packages_list }}"
    state: present

- name: Configure UFW default incoming policy
  community.general.ufw:
    direction: incoming
    default: deny

- name: Configure UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: 'Allow inbound SSH'

- name: Ensure UFW is enabled and active
  community.general.ufw:
    state: enabled
