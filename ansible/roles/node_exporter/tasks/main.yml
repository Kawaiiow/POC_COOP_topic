---
- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create install directory for node_exporter
  ansible.builtin.file:
    path: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64"
    state: directory
    owner: root
    group: root
    mode: '0755'
  check_mode: false

- name: Download and unpack node_exporter release tarball
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_url }}"
    dest: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Link node_exporter binary to {{ node_exporter_install_dir }}/node_exporter
  ansible.builtin.file:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    state: link
    force: true
  notify: Restart node_exporter

- name: Deploy node_exporter systemd service unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart node_exporter

- name: Allow Node Exporter from management network in UFW
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port | string }}"
    proto: tcp
    from_ip: "{{ node_exporter_allowed_network }}"
    comment: 'Allow Prometheus node_exporter from management subnet'

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
